<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti - G'Local Boutique</title>
  <meta name="description" content="Contatta G'Local Boutique. Piazza in Campo Marzio 8, Roma. Tel: 06 275 7259.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="https://glocalboutique.com/wp-content/uploads/2021/06/GLOCAL-logo-45.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-slot"></div>

  <section class="page-hero-mini">
    <div class="container">
      <span class="section-label">G'Local Boutique</span>
      <h1 class="section-title">Contatti</h1>
      <p class="section-subtitle">Siamo nel cuore di Roma, a due passi dal Pantheon.</p>
    </div>
  </section>

  <section class="contact-page">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-details">
            <div class="contact-item">
              <div class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
              <div class="item-text">
                <h4>Indirizzo</h4>
                <p>Piazza in Campo Marzio, 8<br>00186 Roma (RM) Italia</p>
              </div>
            </div>
            <div class="contact-item">
              <div class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                </svg>
              </div>
              <div class="item-text">
                <h4>Telefono</h4>
                <a href="tel:+39062757259">06 275 7259</a>
              </div>
            </div>
            <div class="contact-item">
              <div class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </div>
              <div class="item-text">
                <h4>Email</h4>
                <a href="mailto:infoglocalboutique@gmail.com">infoglocalboutique@gmail.com</a>
              </div>
            </div>
          </div>

          <div class="contact-hours" style="margin-top: 2.5rem;">
            <h3 style="font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 1rem;">Orari di Apertura</h3>
            <div class="hours-grid">
              <div class="hours-row"><span>Lunedi - Sabato</span><span>10:00 - 19:30</span></div>
              <div class="hours-row"><span>Domenica</span><span>Chiuso</span></div>
            </div>
          </div>
        </div>

        <div class="contact-map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2970.01!2d12.4745!3d41.8995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x132f604f2b0!2sPiazza+in+Campo+Marzio%2C+8%2C+00186+Roma+RM!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit"
            allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            title="G'Local Boutique - Mappa"></iframe>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="js/products.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>Components.inject('');</script>
</body>
</html>
