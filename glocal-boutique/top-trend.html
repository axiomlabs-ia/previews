<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Trend - G'Local Boutique</title>
  <meta name="description" content="I gioielli piu richiesti del momento su G'Local Boutique Roma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="https://glocalboutique.com/wp-content/uploads/2021/06/GLOCAL-logo-45.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-shop">
  <div id="header-slot"></div>

  <section class="page-hero-mini">
    <div class="container">
      <span class="section-label">I piu amati</span>
      <h1 class="section-title">Top Trend</h1>
      <p class="section-subtitle">I gioielli piu richiesti e amati del momento. Pezzi iconici selezionati per te.</p>
    </div>
  </section>

  <section class="shop-content">
    <div class="container">
      <div class="shop-layout">
        <aside class="shop-sidebar">
          <div id="price-filter"></div>
        </aside>
        <div class="shop-main">
          <div class="shop-toolbar">
            <span id="product-count"></span>
            <div id="sort-control"></div>
          </div>
          <div id="product-grid" class="product-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
    Components.inject('');
    // Top trend shows the newest / most expensive products as "trending"
    Store.init('all');
    Store.currentSort = 'price-desc';
    Store.applyFilters();
  </script>
</body>
</html>
